<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code memory storage layout</title>
  <desc id="desc">Storage layout diagram for Claude Code auto memory, team memory, agent memory and session memory.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.title{font:700 30px Arial,"Microsoft YaHei",sans-serif;fill:#17202a}.sub{font:400 15px Arial,"Microsoft YaHei",sans-serif;fill:#4b5563}
      .root{fill:#ffffff;stroke:#334155;stroke-width:2;rx:12}.dir{fill:#eef7ff;stroke:#2d5f73;stroke-width:2;rx:10}.file{fill:#fffdf4;stroke:#9a6b2f;stroke-width:2;rx:10}.temp{fill:#f0fdf4;stroke:#3b7f5f;stroke-width:2;rx:10}
      .head{font:700 18px Arial,"Microsoft YaHei",sans-serif;fill:#111827}.body{font:400 14px Arial,"Microsoft YaHei",sans-serif;fill:#374151}.mono{font:400 13px Consolas,monospace;fill:#334155}
      .arrow{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
  </defs>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="56" y="58">Storage Layout: 不是一个数据库，而是多组隔离的 Markdown 工作区</text>
  <text class="sub" x="56" y="86">auto/team/agent 共享 MEMORY.md + topic files 范式；session memory 是当前会话 compact 摘要。</text>

  <rect class="root" x="60" y="132" width="300" height="470"/>
  <text class="head" x="84" y="168">Auto Memory</text>
  <text class="mono" x="84" y="198">~/.claude/projects/&lt;project&gt;/memory/</text>
  <rect class="file" x="92" y="232" width="235" height="62"/><text class="head" x="112" y="258">MEMORY.md</text><text class="body" x="112" y="280">短索引，200 行/25KB</text>
  <rect class="file" x="92" y="324" width="235" height="62"/><text class="head" x="112" y="350">topic.md</text><text class="body" x="112" y="372">frontmatter + 正文</text>
  <rect class="dir" x="92" y="416" width="235" height="62"/><text class="head" x="112" y="442">logs/YYYY/MM/</text><text class="body" x="112" y="464">KAIROS daily logs</text>

  <rect class="root" x="430" y="132" width="300" height="470"/>
  <text class="head" x="454" y="168">Team / Agent Memory</text>
  <rect class="dir" x="462" y="210" width="235" height="78"/><text class="head" x="482" y="236">Team memory</text><text class="body" x="482" y="260">共享 MEMORY.md + 文件</text>
  <rect class="dir" x="462" y="330" width="235" height="104"/><text class="head" x="482" y="356">Agent memory</text><text class="body" x="482" y="380">user / project / local</text><text class="body" x="482" y="404">按 agent type 隔离</text>
  <text class="mono" x="462" y="500">~/.claude/agent-memory/</text>
  <text class="mono" x="462" y="526">.claude/agent-memory/</text>
  <text class="mono" x="462" y="552">.claude/agent-memory-local/</text>

  <rect class="root" x="800" y="132" width="300" height="470"/>
  <text class="head" x="824" y="168">Session Memory</text>
  <text class="mono" x="824" y="198">{projectDir}/{sessionId}/</text>
  <rect class="temp" x="832" y="246" width="235" height="86"/><text class="head" x="852" y="272">session-memory/</text><text class="body" x="852" y="296">summary.md</text><text class="body" x="852" y="318">用于当前会话 compact</text>
  <rect class="temp" x="832" y="380" width="235" height="86"/><text class="head" x="852" y="406">不是长期偏好</text><text class="body" x="852" y="430">不等同 auto memory</text><text class="body" x="852" y="452">不跨项目做 profile</text>

  <path class="dash" d="M327 264 C370 246 414 244 462 246"/>
  <path class="dash" d="M697 382 C750 344 792 318 832 300"/>
  <text class="body" x="65" y="660">读图要点：长期记忆以 topic Markdown 文件为事实源，MEMORY.md 只是入口索引；session memory 是压缩材料，不是长期记忆库。</text>
</svg>
