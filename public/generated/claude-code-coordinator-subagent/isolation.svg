<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-label="Subagent isolation layers">
  <rect width="1200" height="620" fill="#f8f4ed"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1f1a14">Isolation Layers</text>
  <text x="70" y="104" font-family="Arial, sans-serif" font-size="16" fill="#5f564b">子 agent 不是简单复制主 agent：上下文、工具、权限和扩展点都会重组。</text>
  <g font-family="Arial, sans-serif">
    <rect x="90" y="165" width="280" height="330" rx="12" fill="#fffaf2" stroke="#d8c7ae"/>
    <text x="120" y="210" font-size="21" font-weight="700" fill="#1f1a14">Parent Context</text>
    <text x="120" y="250" font-size="15" fill="#50473c">messages</text>
    <text x="120" y="280" font-size="15" fill="#50473c">rendered system prompt</text>
    <text x="120" y="310" font-size="15" fill="#50473c">tool permission mode</text>
    <text x="120" y="340" font-size="15" fill="#50473c">MCP clients</text>
    <rect x="460" y="135" width="280" height="390" rx="12" fill="#eef8f8" stroke="#8dbac0"/>
    <text x="490" y="180" font-size="21" font-weight="700" fill="#123b40">runAgent()</text>
    <text x="490" y="225" font-size="15" fill="#27555a">filter incomplete tool calls</text>
    <text x="490" y="255" font-size="15" fill="#27555a">omit CLAUDE.md for Explore</text>
    <text x="490" y="285" font-size="15" fill="#27555a">resolve tools by agent definition</text>
    <text x="490" y="315" font-size="15" fill="#27555a">scope allowedTools</text>
    <text x="490" y="345" font-size="15" fill="#27555a">load skills / hooks / MCP</text>
    <text x="490" y="375" font-size="15" fill="#27555a">new abort controller for async</text>
    <rect x="830" y="165" width="280" height="330" rx="12" fill="#f5f7ff" stroke="#a8b1d7"/>
    <text x="860" y="210" font-size="21" font-weight="700" fill="#28315c">Worker Context</text>
    <text x="860" y="250" font-size="15" fill="#404a75">prompt messages</text>
    <text x="860" y="280" font-size="15" fill="#404a75">agent system prompt</text>
    <text x="860" y="310" font-size="15" fill="#404a75">filtered tools</text>
    <text x="860" y="340" font-size="15" fill="#404a75">permission prompts policy</text>
    <text x="860" y="370" font-size="15" fill="#404a75">sidechain transcript</text>
    <path d="M370 330 L456 330" stroke="#2a7372" stroke-width="3" marker-end="url(#a)"/>
    <path d="M740 330 L826 330" stroke="#2a7372" stroke-width="3" marker-end="url(#a)"/>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2a7372"/>
    </marker>
  </defs>
</svg>
