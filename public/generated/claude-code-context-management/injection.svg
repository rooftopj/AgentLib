<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic context injection</title>
  <desc id="desc">Fixed context and dynamic attachments are injected at different moments.</desc>
  <style>.bg{fill:#f7f3ec}.box{fill:#fffaf2;stroke:#d8c7ad;stroke-width:2}.green{fill:#e9f3f0;stroke:#2f6f73;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#1d2b2a}.head{font:700 18px Arial,sans-serif;fill:#1d2b2a}.body{font:15px Arial,sans-serif;fill:#5d554a}.line{stroke:#2f6f73;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f73"/></marker></defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="60" y="60">Injection timing: fixed before API, dynamic after tool loop</text>
  <rect class="box" x="80" y="120" width="245" height="120" rx="10"/>
  <text class="head" x="112" y="158">Fixed Context</text>
  <text class="body" x="112" y="190">systemContext</text>
  <text class="body" x="112" y="216">userContext</text>
  <rect class="green" x="468" y="120" width="245" height="120" rx="10"/>
  <text class="head" x="502" y="158">API Request</text>
  <text class="body" x="502" y="190">messagesForQuery</text>
  <text class="body" x="502" y="216">tools + model config</text>
  <rect class="box" x="860" y="120" width="245" height="120" rx="10"/>
  <text class="head" x="892" y="158">Tool Results</text>
  <text class="body" x="892" y="190">assistant tool_use</text>
  <text class="body" x="892" y="216">user tool_result</text>
  <rect class="green" x="468" y="340" width="245" height="120" rx="10"/>
  <text class="head" x="502" y="378">Attachments</text>
  <text class="body" x="502" y="410">queued command</text>
  <text class="body" x="502" y="436">delta + changed files</text>
  <path class="line" d="M325 180 C382 180 412 180 468 180"/>
  <path class="line" d="M713 180 C770 180 802 180 860 180"/>
  <path class="line" d="M982 240 C950 340 812 400 713 400"/>
  <path class="line" d="M468 400 C326 390 214 292 202 240"/>
</svg>
