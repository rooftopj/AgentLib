<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code context management architecture</title>
  <desc id="desc">System context, user context, messages, attachments and compaction pipeline feed the query loop.</desc>
  <style>.bg{fill:#f7f3ec}.box{fill:#fffaf2;stroke:#d8c7ad;stroke-width:2}.green{fill:#e9f3f0;stroke:#2f6f73;stroke-width:2}.gold{fill:#fff2db;stroke:#b08b57;stroke-width:2}.title{font:700 30px Arial,sans-serif;fill:#1d2b2a}.head{font:700 19px Arial,sans-serif;fill:#1d2b2a}.body{font:15px Arial,sans-serif;fill:#5d554a}.small{font:13px Arial,sans-serif;fill:#6d6254}.line{stroke:#2f6f73;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f73"/></marker></defs>
  <rect class="bg" width="1200" height="680"/>
  <text class="title" x="58" y="64">Context Management: layered budget before summarization</text>
  <rect class="box" x="72" y="118" width="250" height="130" rx="10"/>
  <text class="head" x="100" y="154">System Context</text>
  <text class="body" x="100" y="184">git status snapshot</text>
  <text class="body" x="100" y="212">cache breaker</text>
  <rect class="box" x="72" y="302" width="250" height="150" rx="10"/>
  <text class="head" x="100" y="338">User Context</text>
  <text class="body" x="100" y="368">CLAUDE.md</text>
  <text class="body" x="100" y="396">memory files</text>
  <text class="body" x="100" y="424">current date</text>
  <rect class="green" x="430" y="146" width="310" height="170" rx="10"/>
  <text class="head" x="462" y="184">Query Preparation</text>
  <text class="body" x="462" y="216">message history view</text>
  <text class="body" x="462" y="244">tool result budget</text>
  <text class="body" x="462" y="272">microcompact / autocompact</text>
  <rect class="gold" x="430" y="390" width="310" height="150" rx="10"/>
  <text class="head" x="462" y="428">Dynamic Attachments</text>
  <text class="body" x="462" y="458">queued commands</text>
  <text class="body" x="462" y="486">tool / agent / MCP delta</text>
  <text class="body" x="462" y="514">changed files / nested memory</text>
  <rect class="green" x="850" y="250" width="260" height="162" rx="10"/>
  <text class="head" x="884" y="290">Model Call</text>
  <text class="body" x="884" y="322">prepend user context</text>
  <text class="body" x="884" y="350">append system context</text>
  <text class="body" x="884" y="378">stream tool loop</text>
  <path class="line" d="M322 182 C374 194 390 208 430 216"/>
  <path class="line" d="M322 376 C380 352 398 296 430 272"/>
  <path class="line" d="M740 232 C794 248 812 288 850 312"/>
  <path class="line" d="M740 466 C798 442 816 392 850 364"/>
  <text class="small" x="70" y="610">Key idea: stable context stays cached; volatile context travels as message attachments or compacted summaries.</text>
</svg>
