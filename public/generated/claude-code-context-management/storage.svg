<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Tool result storage and replacement</title>
  <desc id="desc">Large tool outputs are persisted to disk and replaced by stable preview messages.</desc>
  <style>.bg{fill:#f7f3ec}.box{fill:#fffaf2;stroke:#d8c7ad;stroke-width:2}.green{fill:#e9f3f0;stroke:#2f6f73;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#1d2b2a}.head{font:700 18px Arial,sans-serif;fill:#1d2b2a}.body{font:15px Arial,sans-serif;fill:#5d554a}.mono{font:14px Consolas,monospace;fill:#5d554a}.line{stroke:#2f6f73;stroke-width:3;fill:none;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f73"/></marker></defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="title" x="60" y="60">Tool result budget: persist blob, keep stable reference</text>
  <rect class="box" x="80" y="150" width="270" height="130" rx="10"/>
  <text class="head" x="112" y="188">Large tool_result</text>
  <text class="body" x="112" y="220">grep / bash / read output</text>
  <text class="body" x="112" y="248">may exceed budget</text>
  <rect class="green" x="465" y="110" width="300" height="150" rx="10"/>
  <text class="head" x="498" y="148">Persisted blob</text>
  <text class="mono" x="498" y="184">session/tool-results/id.txt</text>
  <text class="body" x="498" y="218">full content on disk</text>
  <rect class="green" x="465" y="345" width="300" height="150" rx="10"/>
  <text class="head" x="498" y="383">Replacement</text>
  <text class="mono" x="498" y="418">&lt;persisted-output&gt;</text>
  <text class="body" x="498" y="452">path + preview in message</text>
  <rect class="box" x="885" y="240" width="250" height="150" rx="10"/>
  <text class="head" x="918" y="278">Resume stability</text>
  <text class="body" x="918" y="310">content-replacement</text>
  <text class="body" x="918" y="338">same template</text>
  <text class="body" x="918" y="366">same cache prefix</text>
  <path class="line" d="M350 210 C400 184 420 170 465 168"/>
  <path class="line" d="M350 242 C410 314 424 390 465 420"/>
  <path class="line" d="M765 420 C820 392 842 338 885 318"/>
</svg>
