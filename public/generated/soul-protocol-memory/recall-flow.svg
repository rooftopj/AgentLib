<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">soul-protocol recall flow</title>
  <desc id="desc">A flow diagram showing Soul.recall, MemoryManager filters, RecallEngine candidate search, activation ranking, optional smart rerank, and returned memories.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f5b66"/>
    </marker>
    <style>
      .bg{fill:#f7f3ed}
      .box{fill:#fffdf8;stroke:#cfc7ba;stroke-width:2}
      .accent{fill:#e9f3ee;stroke:#4f8f72;stroke-width:2}
      .optional{fill:#eef2fb;stroke:#6478b8;stroke-width:2}
      .title{font:700 20px Arial,sans-serif;fill:#1f1b16}
      .text{font:400 15px Arial,sans-serif;fill:#3c352d}
      .small{font:400 13px Arial,sans-serif;fill:#5d554c}
      .arrow{stroke:#4f5b66;stroke-width:2.2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="520"/>
  <text x="48" y="52" class="title">Recall is explicit: candidate search, filters, activation, optional rerank</text>
  <rect x="54" y="105" width="170" height="100" rx="8" class="box"/>
  <text x="78" y="140" class="title">Soul.recall</text>
  <text x="78" y="169" class="text">query + limit</text>
  <text x="78" y="191" class="small">user/domain/layer</text>
  <rect x="282" y="105" width="190" height="100" rx="8" class="box"/>
  <text x="306" y="139" class="title">MemoryManager</text>
  <text x="306" y="168" class="text">expand fetch_limit</text>
  <text x="306" y="190" class="small">scope and namespace filters</text>
  <rect x="530" y="105" width="190" height="100" rx="8" class="accent"/>
  <text x="554" y="139" class="title">RecallEngine</text>
  <text x="554" y="168" class="text">BM25 candidates</text>
  <text x="554" y="190" class="small">episodic / semantic / procedural</text>
  <rect x="778" y="105" width="190" height="100" rx="8" class="accent"/>
  <text x="802" y="139" class="title">Activation</text>
  <text x="802" y="168" class="text">recency + frequency</text>
  <text x="802" y="190" class="small">emotion / salience / personality</text>
  <rect x="778" y="285" width="190" height="100" rx="8" class="optional"/>
  <text x="802" y="319" class="title">smart_recall</text>
  <text x="802" y="348" class="text">optional LLM rerank</text>
  <text x="802" y="370" class="small">only when enabled + engine exists</text>
  <rect x="530" y="285" width="190" height="100" rx="8" class="box"/>
  <text x="554" y="319" class="title">Vector strategy</text>
  <text x="554" y="348" class="text">optional candidate scoring</text>
  <text x="554" y="370" class="small">not default storage backend</text>
  <rect x="54" y="285" width="418" height="100" rx="8" class="box"/>
  <text x="78" y="319" class="title">Returned MemoryEntry list</text>
  <text x="78" y="348" class="text">superseded facts filtered; trace records result ids</text>
  <text x="78" y="370" class="small">caller decides how to place memories into model context</text>
  <path d="M224 155 H282" class="arrow"/>
  <path d="M472 155 H530" class="arrow"/>
  <path d="M720 155 H778" class="arrow"/>
  <path d="M873 205 V285" class="arrow"/>
  <path d="M778 335 H720" class="arrow"/>
  <path d="M530 335 H472" class="arrow"/>
  <path d="M530 250 C460 230, 390 230, 330 285" class="arrow"/>
  <text x="342" y="254" class="small">strategy can be swapped</text>
</svg>
