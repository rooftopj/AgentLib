<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Restore split paths</title>
  <desc id="desc">Restore code and conversation uses separate handlers.</desc>
  <style>
    .bg{fill:#f7f3ec}.box{fill:#fffaf2;stroke:#d8c7ad;stroke-width:2}.green{fill:#e9f3f0;stroke:#2f6f73;stroke-width:2}.gold{fill:#fff2db;stroke:#b08b57;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#1d2b2a}.head{font:700 19px Arial,sans-serif;fill:#1d2b2a}.body{font:15px Arial,sans-serif;fill:#5d554a}.line{stroke:#2f6f73;stroke-width:3;fill:none;marker-end:url(#arrow)}.line2{stroke:#b08b57;stroke-width:3;fill:none;marker-end:url(#arrow2)}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f73"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b08b57"/></marker>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text class="title" x="60" y="60">Restore option splits into two handlers</text>

  <rect class="box" x="82" y="206" width="260" height="116" rx="10"/>
  <text class="head" x="116" y="246">Selected message</text>
  <text class="body" x="116" y="278">"before this prompt"</text>

  <rect class="green" x="492" y="92" width="290" height="128" rx="10"/>
  <text class="head" x="526" y="132">Conversation restore</text>
  <text class="body" x="526" y="164">handleRestoreMessage</text>
  <text class="body" x="526" y="192">rewindConversationTo</text>

  <rect class="gold" x="492" y="340" width="290" height="128" rx="10"/>
  <text class="head" x="526" y="380">Code restore</text>
  <text class="body" x="526" y="412">fileHistoryRewind</text>
  <text class="body" x="526" y="440">applySnapshot</text>

  <rect class="green" x="892" y="92" width="230" height="128" rx="10"/>
  <text class="head" x="926" y="132">New REPL state</text>
  <text class="body" x="926" y="164">messages sliced</text>
  <text class="body" x="926" y="192">conversationId reset</text>

  <rect class="gold" x="892" y="340" width="230" height="128" rx="10"/>
  <text class="head" x="926" y="380">Filesystem state</text>
  <text class="body" x="926" y="412">copy backup</text>
  <text class="body" x="926" y="440">or unlink new file</text>

  <path class="line" d="M342 242 C410 184 430 156 492 156"/>
  <path class="line2" d="M342 286 C408 342 430 404 492 404"/>
  <path class="line" d="M782 156 C828 156 846 156 892 156"/>
  <path class="line2" d="M782 404 C828 404 846 404 892 404"/>
</svg>
