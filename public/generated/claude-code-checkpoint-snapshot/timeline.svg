<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">File history checkpoint timeline</title>
  <desc id="desc">User messages create checkpoints, tools attach old file backups before editing.</desc>
  <style>
    .bg{fill:#f7f3ec}.axis{stroke:#1d2b2a;stroke-width:4}.tick{stroke:#1d2b2a;stroke-width:3}.card{fill:#fffaf2;stroke:#d8c7ad;stroke-width:2}.backup{fill:#e9f3f0;stroke:#2f6f73;stroke-width:2}.warn{fill:#fff2db;stroke:#b08b57;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#1d2b2a}.head{font:700 18px Arial,sans-serif;fill:#1d2b2a}.body{font:15px Arial,sans-serif;fill:#5d554a}.small{font:13px Arial,sans-serif;fill:#6d6254}.line{stroke:#2f6f73;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f73"/></marker></defs>
  <rect class="bg" width="1200" height="520"/>
  <text class="title" x="60" y="60">When snapshots are written</text>
  <line class="axis" x1="100" y1="250" x2="1080" y2="250"/>

  <line class="tick" x1="180" y1="220" x2="180" y2="280"/>
  <rect class="card" x="90" y="105" width="180" height="90" rx="8"/>
  <text class="head" x="118" y="138">User message A</text>
  <text class="body" x="118" y="166">make snapshot A</text>

  <line class="tick" x1="430" y1="220" x2="430" y2="280"/>
  <rect class="backup" x="330" y="300" width="210" height="96" rx="8"/>
  <text class="head" x="354" y="334">Tool edit file</text>
  <text class="body" x="354" y="362">trackEdit before write</text>
  <text class="small" x="354" y="386">backup old content into A</text>

  <line class="tick" x1="680" y1="220" x2="680" y2="280"/>
  <rect class="card" x="588" y="105" width="190" height="90" rx="8"/>
  <text class="head" x="616" y="138">User message B</text>
  <text class="body" x="616" y="166">make snapshot B</text>

  <line class="tick" x1="930" y1="220" x2="930" y2="280"/>
  <rect class="backup" x="830" y="300" width="220" height="96" rx="8"/>
  <text class="head" x="856" y="334">Another edit</text>
  <text class="body" x="856" y="362">new version if changed</text>
  <text class="small" x="856" y="386">reuse backup if unchanged</text>

  <path class="line" d="M430 300 C400 250 300 168 270 150"/>
  <path class="line" d="M930 300 C890 252 815 168 778 150"/>

  <rect class="warn" x="60" y="430" width="1080" height="54" rx="8"/>
  <text class="body" x="86" y="464">Snapshot is a message coordinate. Old file content is attached later, just before Claude Code tools mutate tracked files.</text>
</svg>
