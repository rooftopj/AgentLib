<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint storage layout</title>
  <desc id="desc">Transcript metadata points to file backup blobs under file-history session directory.</desc>
  <style>
    .bg{fill:#f7f3ec}.box{fill:#fffaf2;stroke:#d8c7ad;stroke-width:2}.blob{fill:#e9f3f0;stroke:#2f6f73;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#1d2b2a}.head{font:700 19px Arial,sans-serif;fill:#1d2b2a}.body{font:15px Consolas,monospace;fill:#5d554a}.label{font:15px Arial,sans-serif;fill:#6d6254}.line{stroke:#2f6f73;stroke-width:3;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f73"/></marker></defs>
  <rect class="bg" width="1200" height="620"/>
  <text class="title" x="60" y="60">Storage: JSONL metadata plus backup blobs</text>

  <rect class="box" x="70" y="115" width="430" height="390" rx="10"/>
  <text class="head" x="98" y="152">Transcript JSONL</text>
  <text class="body" x="98" y="190">~/.claude/projects/&lt;project&gt;/</text>
  <text class="body" x="98" y="216">&lt;sessionId&gt;.jsonl</text>
  <text class="body" x="98" y="260">{</text>
  <text class="body" x="118" y="286">type: "file-history-snapshot",</text>
  <text class="body" x="118" y="312">messageId: "user-message-id",</text>
  <text class="body" x="118" y="338">trackedFileBackups: {</text>
  <text class="body" x="138" y="364">"src/a.ts": "hash@v1",</text>
  <text class="body" x="138" y="390">"src/new.ts": null</text>
  <text class="body" x="118" y="416">}</text>
  <text class="body" x="98" y="442">}</text>

  <rect class="blob" x="700" y="125" width="360" height="98" rx="10"/>
  <text class="head" x="730" y="160">Backup blob</text>
  <text class="body" x="730" y="190">~/.claude/file-history/session/hash@v1</text>

  <rect class="blob" x="700" y="275" width="360" height="98" rx="10"/>
  <text class="head" x="730" y="310">Backup blob</text>
  <text class="body" x="730" y="340">~/.claude/file-history/session/hash@v2</text>

  <rect class="blob" x="700" y="425" width="360" height="98" rx="10"/>
  <text class="head" x="730" y="460">Null marker</text>
  <text class="label" x="730" y="490">file did not exist at target version</text>

  <path class="line" d="M500 358 C590 338 620 176 700 176"/>
  <path class="line" d="M500 372 C602 372 620 324 700 324"/>
  <path class="line" d="M500 388 C596 408 620 474 700 474"/>
</svg>
