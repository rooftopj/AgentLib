<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint boundary map</title>
  <desc id="desc">File history, transcript, git, worktree, todo and tool result are separate layers.</desc>
  <style>
    .bg{fill:#f7f3ec}.main{fill:#e9f3f0;stroke:#2f6f73;stroke-width:3}.side{fill:#fffaf2;stroke:#d8c7ad;stroke-width:2}.warn{fill:#fff2db;stroke:#b08b57;stroke-width:2}.title{font:700 28px Arial,sans-serif;fill:#1d2b2a}.head{font:700 19px Arial,sans-serif;fill:#1d2b2a}.body{font:15px Arial,sans-serif;fill:#5d554a}.small{font:13px Arial,sans-serif;fill:#6d6254}.line{stroke:#2f6f73;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#b08b57;stroke-width:2.5;fill:none;stroke-dasharray:7 7}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2f6f73"/></marker></defs>
  <rect class="bg" width="1200" height="600"/>
  <text class="title" x="60" y="60">Boundary: what checkpoint snapshot owns</text>

  <rect class="main" x="420" y="206" width="360" height="150" rx="12"/>
  <text class="head" x="462" y="248">File-history snapshot</text>
  <text class="body" x="462" y="282">tracked files changed by Claude tools</text>
  <text class="body" x="462" y="310">metadata in transcript</text>
  <text class="body" x="462" y="338">backup blobs under file-history</text>

  <rect class="side" x="80" y="106" width="260" height="110" rx="10"/>
  <text class="head" x="112" y="146">Transcript</text>
  <text class="body" x="112" y="178">conversation records</text>
  <text class="small" x="112" y="202">stores snapshot metadata</text>

  <rect class="side" x="80" y="386" width="260" height="110" rx="10"/>
  <text class="head" x="112" y="426">Worktree state</text>
  <text class="body" x="112" y="458">resume context</text>
  <text class="small" x="112" y="482">not rollback engine</text>

  <rect class="warn" x="860" y="96" width="260" height="120" rx="10"/>
  <text class="head" x="892" y="136">Git</text>
  <text class="body" x="892" y="168">no commit</text>
  <text class="body" x="892" y="194">no stash dependency</text>

  <rect class="warn" x="860" y="386" width="260" height="120" rx="10"/>
  <text class="head" x="892" y="426">Other state</text>
  <text class="body" x="892" y="458">todo / tool result</text>
  <text class="body" x="892" y="484">separate persistence</text>

  <path class="line" d="M340 160 C388 202 398 246 420 260"/>
  <path class="line" d="M340 442 C390 394 398 338 420 316"/>
  <path class="dash" d="M780 256 C828 204 834 164 860 152"/>
  <path class="dash" d="M780 326 C828 382 834 430 860 450"/>
</svg>
